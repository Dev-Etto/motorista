name: Sugerir uma melhoria
description: Uma ideia de recurso ou de como deixar o app melhor.
title: "[Sugestão] "
labels: ["enhancement"]
body:
  - type: textarea
    id: ideia
    attributes:
      label: Qual é a sua ideia?
      placeholder: Mostrar o lucro separado por plataforma no início.
    validations:
      required: true
  - type: textarea
    id: motivo
    attributes:
      label: Como isso ajudaria no seu dia a dia?
    validations:
      required: false
